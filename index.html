<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดวางแผนเดินทาง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe6d6;--card:#f7f1e5;--ink:#34251b;--mute:#86725d;--line:#d6c7ae;--walnut:#4a3324;--cognac:#8a5a3b;--brass:#a58a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.7 'Sarabun',sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond','Noto Serif Thai',serif;font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:2.4rem;line-height:1.2}
h2{font-size:1.6rem;margin-bottom:12px}
h3{font-size:1.35rem}
.wrap{max-width:720px;margin:0 auto;padding:36px 20px 80px}
.mute{color:var(--mute)}.sm{font-size:.85rem}
.place-name{font-family:'Cormorant Garamond','Noto Serif Thai',serif;font-style:italic;font-size:1.15rem;color:var(--cognac)}
.rule{height:1px;background:var(--brass);width:56px;margin:16px 0 22px}
header{margin-bottom:8px}
a{color:var(--cognac);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.back{display:inline-block;margin-bottom:18px;font-size:.9rem;color:var(--mute)}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px;margin-bottom:12px}
.card.click{cursor:pointer;transition:border-color .2s}
.card.click:hover{border-color:var(--brass)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:0 0 22px}
.tabs a{padding:8px 0;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--walnut);border-color:var(--cognac)}
.tabs a:hover{text-decoration:none}
section{margin-bottom:26px}
section h3{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .grow b{font-weight:500;cursor:pointer}
.empty{color:var(--mute);font-style:italic;padding:10px 0}
input,select,textarea{font:inherit;color:var(--ink);background:#fbf8f1;border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.item select{width:auto;max-width:130px;padding:6px 8px;font-size:.9rem}
.item input.time{width:96px;padding:6px 8px;font-size:.9rem}
label{display:block;margin-bottom:14px;font-size:.9rem;color:var(--mute)}
label input,label select,label textarea{margin-top:4px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font:500 .95rem 'Sarabun',sans-serif;background:var(--walnut);color:#f7f1e5;border:1px solid var(--walnut);border-radius:2px;padding:9px 20px;cursor:pointer}
.btn:hover{background:var(--cognac);border-color:var(--cognac)}
.btn.ghost{background:transparent;color:var(--walnut);border-color:var(--brass)}
.btn.ghost:hover{background:var(--card)}
.btn.danger{margin-right:auto;color:#8a3b2e;border-color:#c9a79f}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;padding:26px;width:calc(100% - 32px);max-width:440px}
dialog::backdrop{background:rgba(52,37,27,.5)}
.badge{font-size:.8rem;color:var(--mute);border:1px solid var(--line);padding:0 8px;border-radius:2px;white-space:nowrap}
.foot{margin-top:40px;font-size:.85rem;color:var(--mute)}
@media(max-width:480px){h1{font-size:2rem}.item{flex-wrap:wrap}.item .grow{flex-basis:60%}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>

<script>
// ===== ตั้งค่า (แก้ 2 บรรทัดนี้) =====
const API = 'https://script.google.com/macros/s/AKfycbx_kVfzDSU75VeOqXkhcOL0WO7S49xsL-nzv7A-BfnZFtls-8-28vuVrAsP99Ekr20_/exec';
const CLIENT_ID = '396446244209-jng9025898g5agc3kiksriiqr5inn0lr.apps.googleusercontent.com';

const TYPES = ['ที่เที่ยว','ร้านอาหาร','ที่พัก','การเดินทาง','ช้อปปิ้ง','อื่น ๆ'];
let token = null, tab = 'days';
const S = { me: {}, trips: [], trip: null, places: [], role: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setApp = h => { $('#app').innerHTML = h; };
const days = () => Math.max(1, +S.trip.days || 1);

async function call(action, p = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token, ...p }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function run(f) {
  try { return await f(); }
  catch (e) {
    if (/token|หมดอายุ/.test(e.message)) { token = null; try { sessionStorage.removeItem('tk'); } catch (_) {} login('เซสชันหมดอายุ กรุณาลงชื่อเข้าใช้อีกครั้ง'); }
    else alert(e.message);
  }
}
function dlg(h) { const d = $('#dlg'); d.innerHTML = h; d.showModal(); }
const closeDlg = () => $('#dlg').close();

function boot() {
  try { token = sessionStorage.getItem('tk'); } catch (_) {}
  token ? trips() : login();
}
function login(msg) {
  setApp(`<div class="login"><h1>สมุดวางแผนเดินทาง</h1><div class="rule"></div>
    <p class="mute">${esc(msg || 'ลงชื่อเข้าใช้ด้วย Google เพื่อเปิดทริปของคุณ')}</p><div id="gbtn"></div></div>`);
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { token = r.credential; try { sessionStorage.setItem('tk', token); } catch (_) {} trips(); } });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', shape: 'rectangular', locale: 'th' });
}
function logout() {
  token = null; try { sessionStorage.removeItem('tk'); } catch (_) {}
  google.accounts.id.disableAutoSelect(); login();
}

// ===== รายการทริป =====
async function trips() {
  setApp('<p class="mute">กำลังโหลด...</p>');
  await run(async () => { const d = await call('listTrips'); S.me = d.me; S.trips = d.trips; renderTrips(); });
}
function renderTrips() {
  setApp(`<header><h1>ทริปของฉัน</h1><div class="rule"></div></header>
    ${S.trips.map(t => `<div class="card click" onclick="openTrip('${esc(t.trip_id)}')">
      <h3>${esc(t.name)}</h3>
      <div class="mute sm">${esc(t.country || 'ยังไม่ระบุประเทศ')}, ${Math.max(1, +t.days || 1)} วัน${t.start_date ? ', เริ่ม ' + fmt(t.start_date, 0) : ''}</div></div>`).join('')
      || `<p class="mute">${S.me.admin ? 'ยังไม่มีทริป เริ่มสร้างทริปแรกได้เลย' : 'คุณยังไม่ได้รับสิทธิ์เข้าทริปใด ให้เจ้าของเพิ่มอีเมลของคุณก่อน'}</p>`}
    ${S.me.admin ? '<div class="row"><button class="btn" onclick="tripForm()">สร้างทริปใหม่</button></div>' : ''}
    <div class="foot">${esc(S.me.email)} <a onclick="logout()">ออกจากระบบ</a></div>`);
}
function tripForm() {
  dlg(`<h2>สร้างทริปใหม่</h2>
    <label>ชื่อทริป<input id="f_name" placeholder="เช่น ทริปปี 2027"></label>
    <label>ประเทศ (ใส่ทีหลังได้)<input id="f_country"></label>
    <label>จำนวนวัน (เว้นว่างแล้วเริ่มที่ 1 วัน)<input id="f_days" type="number" min="1"></label>
    <label>วันเริ่มเดินทาง (ใส่ทีหลังได้)<input id="f_start" type="date"></label>
    <label>สกุลเงิน<input id="f_cur" placeholder="เช่น JPY, EUR"></label>
    <div class="row"><button class="btn ghost" onclick="closeDlg()">ยกเลิก</button><button class="btn" onclick="saveTrip()">สร้างทริป</button></div>`);
}
async function saveTrip() {
  const name = $('#f_name').value.trim();
  if (!name) return alert('กรุณาใส่ชื่อทริป');
  await run(async () => {
    const t = await call('createTrip', { name, country: $('#f_country').value, days: $('#f_days').value, start_date: $('#f_start').value, currency: $('#f_cur').value });
    closeDlg(); openTrip(t.trip_id);
  });
}

// ===== หน้าทริป =====
function applyTrip(d) { S.trip = d.trip; S.places = d.places; S.role = d.role; }
async function openTrip(id) {
  setApp('<p class="mute">กำลังโหลด...</p>');
  await run(async () => { applyTrip(await call('getTrip', { tripId: id })); tab = 'days'; renderTrip(); });
}
function fmt(s, i) {
  const [y, m, d] = String(s).split('-').map(Number);
  if (!y) return '';
  return new Date(y, m - 1, d + i).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
}
function go(t) { tab = t; renderTrip(); }
function renderTrip() {
  const t = S.trip;
  setApp(`<header><a class="back" onclick="trips()">กลับไปทริปทั้งหมด</a>
    <div class="place-name">${esc(t.country || 'ยังไม่ระบุประเทศ')}</div>
    <h1>${esc(t.name)}</h1>
    <div class="mute sm">${days()} วัน${t.start_date ? ', เริ่ม ' + fmt(t.start_date, 0) : ''}${t.currency ? ', ' + esc(t.currency) : ''}
      &nbsp;<a onclick="tripEdit()">แก้ไขทริป</a></div><div class="rule"></div></header>
    <nav class="tabs"><a class="${tab === 'days' ? 'on' : ''}" onclick="go('days')">ตารางวัน</a>
    <a class="${tab === 'places' ? 'on' : ''}" onclick="go('places')">สถานที่ (${S.places.length})</a></nav>
    ${tab === 'days' ? daysView() : placesView()}`);
}
function tripEdit() {
  const t = S.trip;
  dlg(`<h2>แก้ไขทริป</h2>
    <label>ชื่อทริป<input id="f_name" value="${esc(t.name)}"></label>
    <label>ประเทศ<input id="f_country" value="${esc(t.country)}"></label>
    <label>วันเริ่มเดินทาง<input id="f_start" type="date" value="${esc(t.start_date)}"></label>
    <label>สกุลเงิน<input id="f_cur" value="${esc(t.currency)}"></label>
    <div class="row"><button class="btn ghost" onclick="closeDlg()">ยกเลิก</button><button class="btn" onclick="saveTripEdit()">บันทึก</button></div>`);
}
async function saveTripEdit() {
  await run(async () => {
    applyTrip(await call('updateTrip', { tripId: S.trip.trip_id, fields: { name: $('#f_name').value, country: $('#f_country').value, start_date: $('#f_start').value, currency: $('#f_cur').value } }));
    closeDlg(); renderTrip();
  });
}

// ===== ตารางวัน =====
const byTime = L => L.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
function item(p) {
  const n = days();
  let o = `<option value="0"${+p.day >= 1 && +p.day <= n ? '' : ' selected'}>ยังไม่จัดวัน</option>`;
  for (let i = 1; i <= n; i++) o += `<option value="${i}"${+p.day === i ? ' selected' : ''}>วันที่ ${i}</option>`;
  const id = esc(p.place_id);
  return `<div class="item"><input class="time" type="time" value="${esc(p.time)}" aria-label="เวลา" onchange="upd('${id}',{time:this.value})">
    <div class="grow"><b onclick="placeForm('${id}')">${esc(p.name)}</b>
    <div class="mute sm">${esc([p.type, p.city].filter(Boolean).join(', '))}${p.map_url ? ` <a href="${esc(p.map_url)}" target="_blank" rel="noopener">เปิดแผนที่</a>` : ''}</div></div>
    <select aria-label="จัดลงวัน" onchange="upd('${id}',{day:+this.value})">${o}</select></div>`;
}
function daysView() {
  const n = days();
  let h = '';
  const un = S.places.filter(p => !(+p.day >= 1 && +p.day <= n));
  if (un.length) h += `<section><h3>ยังไม่จัดวัน</h3>${un.map(item).join('')}</section>`;
  for (let i = 1; i <= n; i++) {
    const L = byTime(S.places.filter(p => +p.day === i));
    h += `<section><h3>วันที่ ${i} <span class="mute sm">${S.trip.start_date ? fmt(S.trip.start_date, i - 1) : ''}</span></h3>
      ${L.map(item).join('') || '<div class="empty">ยังไม่มีแผนสำหรับวันนี้</div>'}</section>`;
  }
  return h + `<div class="row"><button class="btn ghost" onclick="setDays(${n + 1})">เพิ่มวัน</button>
    ${n > 1 ? `<button class="btn ghost" onclick="rmDay()">ลบวันที่ ${n}</button>` : ''}
    <button class="btn" onclick="placeForm()">เพิ่มสถานที่</button></div>`;
}
async function setDays(n) {
  await run(async () => { applyTrip(await call('updateTrip', { tripId: S.trip.trip_id, fields: { days: n } })); renderTrip(); });
}
function rmDay() {
  const n = days(), c = S.places.filter(p => +p.day === n).length;
  if (c && !confirm(`วันที่ ${n} มี ${c} สถานที่ ถ้าลบวัน สถานที่เหล่านี้จะย้ายไปอยู่ในรายการ "ยังไม่จัดวัน" ลบวันนี้หรือไม่`)) return;
  setDays(n - 1);
}
function upd(id, patch) {
  Object.assign(S.places.find(x => x.place_id === id), patch);
  renderTrip();
  run(() => call('savePlace', { tripId: S.trip.trip_id, place: { place_id: id, ...patch } }));
}

// ===== สถานที่ =====
function placesView() {
  return `<div class="row" style="margin:0 0 14px"><button class="btn" onclick="placeForm()">เพิ่มสถานที่</button></div>` +
    (S.places.map(p => `<div class="card click" onclick="placeForm('${esc(p.place_id)}')">
      <div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(p.name)}</h3>
      <span class="badge">${+p.day >= 1 && +p.day <= days() ? 'วันที่ ' + (+p.day) : 'ยังไม่จัดวัน'}</span></div>
      <div class="mute sm">${esc([p.type, p.city].filter(Boolean).join(', '))}</div>
      ${p.note ? `<div style="margin-top:6px">${esc(p.note)}</div>` : ''}</div>`).join('')
      || '<p class="empty">ยังไม่มีสถานที่ เริ่มเพิ่มที่อยากไปได้เลย</p>');
}
function placeForm(id) {
  const p = id ? S.places.find(x => x.place_id === id) : {};
  const eid = id ? esc(id) : '';
  dlg(`<h2>${id ? 'แก้ไขสถานที่' : 'เพิ่มสถานที่'}</h2>
    <label>ชื่อสถานที่<input id="p_name" value="${esc(p.name)}"></label>
    <label>ประเภท<select id="p_type">${TYPES.map(t => `<option${t === p.type ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    <label>เมือง<input id="p_city" value="${esc(p.city)}"></label>
    <label>ลิงก์แผนที่ (Google Maps)<input id="p_map" type="url" value="${esc(p.map_url)}"></label>
    <label>โน้ต<textarea id="p_note" rows="3">${esc(p.note)}</textarea></label>
    <div class="row">${id ? `<button class="btn ghost danger" onclick="delPl('${eid}')">ลบ</button>` : ''}
    <button class="btn ghost" onclick="closeDlg()">ยกเลิก</button><button class="btn" onclick="savePl('${eid}')">บันทึก</button></div>`);
}
async function savePl(id) {
  const g = k => $('#p_' + k).value;
  const place = { place_id: id || undefined, name: g('name'), type: g('type'), city: g('city'), map_url: g('map'), note: g('note') };
  if (!place.name.trim()) return alert('กรุณาใส่ชื่อสถานที่');
  await run(async () => {
    const s = await call('savePlace', { tripId: S.trip.trip_id, place });
    const i = S.places.findIndex(x => x.place_id === s.place_id);
    i < 0 ? S.places.push(s) : (S.places[i] = s);
    closeDlg(); renderTrip();
  });
}
async function delPl(id) {
  if (!confirm('ลบสถานที่นี้ถาวรหรือไม่')) return;
  await run(async () => {
    await call('deletePlace', { tripId: S.trip.trip_id, placeId: id });
    S.places = S.places.filter(x => x.place_id !== id);
    closeDlg(); renderTrip();
  });
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="boot()"></script>
</body>
</html>
