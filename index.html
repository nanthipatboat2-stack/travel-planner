<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แพลนทริป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="initG()"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fff;--ink:#111;--mute:#8A8F98;--line:#ECEDEF;--acc:#0F7B84;--acc-ink:#fff;--soft:#F5F6F7;--bad:#D92D20}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 'Inter','Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:28px 20px 120px}
h1{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.25}
h2{font-size:1rem;font-weight:500;margin:0}
.mute{color:var(--mute);font-size:.88rem}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.pri{background:var(--acc);color:var(--acc-ink);font-weight:500;border-radius:999px;padding:12px 22px}
.pri:active{opacity:.85}
.ghost{color:var(--mute);padding:6px 0;font-size:.9rem}
.ghost:hover{color:var(--ink)}
.danger:hover{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:28px}
.login{padding-top:24vh}
.login .mute{margin:0 0 28px}
#gbtn{display:flex}
.trip{display:block;width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line)}
.trip:first-of-type{border-top:1px solid var(--line)}
.trip:hover b{color:var(--acc)}
.trip b{font-size:1.15rem;font-weight:500;display:block}
.tabs{display:flex;gap:22px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-top:24px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:var(--mute);padding:10px 0 9px;text-align:left;line-height:1.3;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab small{display:block;font-size:.72rem;opacity:.8}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:500}
.pl{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.tm{color:var(--acc);font-weight:500;font-size:.85rem;font-variant-numeric:tabular-nums;padding-top:2px}
.tag{font-size:.8rem;color:var(--mute)}
.note{margin:8px 0 0;white-space:pre-wrap;color:var(--mute);font-size:.92rem}
.act{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
.act a{color:var(--acc);font-size:.88rem;font-weight:500;text-decoration:none}
.act a:hover{text-decoration:underline;text-underline-offset:3px}
.act .ghost{font-size:.88rem;padding:0}
.map{border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:16/10;margin:16px 0 8px}
.map iframe{width:100%;height:100%;border:0;display:block}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.mapbar a{color:var(--acc);font-weight:500;font-size:.88rem;text-decoration:none}
.ci{margin-top:8px;font-size:.85rem;color:var(--acc);font-weight:500}
.ci-btn{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:500}
.ci-btn.again{background:none;color:var(--acc);padding:0;font-size:.88rem}
.now{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:14px 16px;margin-top:18px}
.now b{font-weight:600}
.pri.sm{padding:8px 16px;font-size:.88rem;flex:none}
.go{color:var(--acc);font-weight:500;font-size:.88rem;padding:0}
.opt{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.opt b{display:block;font-weight:500}
.opt small{display:block;color:var(--mute);font-size:.82rem}
.opt:hover b{color:var(--acc)}
.mode{padding:16px 0;border-bottom:1px solid var(--line)}
.mode h3{font-size:1rem;font-weight:600;margin:0 0 2px}
.fare{font-weight:600;color:var(--acc);margin-top:4px}
.stp{margin:8px 0 0;padding-left:20px;color:var(--mute);font-size:.88rem}
.stp li{margin:4px 0}
.mode>a{color:var(--acc);font-weight:500;font-size:.88rem;text-decoration:none;display:inline-block;margin-top:8px}
.rmap{height:230px;border-radius:12px;margin:12px 0 4px;overflow:hidden;position:relative;z-index:0;background:var(--soft)}
.rmap svg{display:block;width:100%;height:100%}
.mhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:2px 0}
.mhead .mute{margin-left:auto;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.mbody{padding:8px 0 2px 20px}
.mbody a{color:var(--acc);font-weight:500;font-size:.88rem;text-decoration:none;display:inline-block;margin-top:8px}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;padding:14px 26px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px 20px 28px}
.sheet h2{font-size:1.25rem;font-weight:600;margin-bottom:6px}
label{display:block;margin:16px 0 6px;font-weight:500;font-size:.8rem;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--soft);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.btns{display:flex;gap:16px;justify-content:flex-end;align-items:center;margin-top:24px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;display:none;max-width:90vw;z-index:30;font-size:.9rem}
.empty{text-align:center;color:var(--mute);padding:56px 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
// ===== ตั้งค่า (แก้ 1 บรรทัด) =====
const WEB_APP_URL = 'วาง URL ของ Web App ที่ลงท้ายด้วย /exec ตรงนี้';
const CLIENT_ID = '396446244209-jng9025898g5agc3kiksriiqr5inn0lr.apps.googleusercontent.com';

const TYPES = { sight:'ที่เที่ยว', food:'ร้านอาหาร', stay:'ที่พัก', shop:'ช้อปปิ้ง', move:'เดินทาง', other:'อื่นๆ' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = sessionStorage.getItem('tk') || '';
const S = { me: null, trips: [], cur: null, day: 0 };

function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3200); }

async function api(action, data = {}) {
  let j;
  try {
    const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action, token, ...data }) });
    j = await res.json();
  } catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจ WEB_APP_URL และอินเทอร์เน็ต'); }
  if (!j.ok) {
    if (/ล็อกอินใหม่|token/.test(j.error)) logout();
    throw new Error(j.error);
  }
  return j.data;
}

// ===== ล็อกอิน =====
function initG() {
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { token = r.credential; sessionStorage.setItem('tk', token); loadTrips(); } });
  if (!token) renderLogin(); else loadTrips();
}
function renderLogin() {
  $('#app').innerHTML = '<div class="login"><h1>แพลนทริป</h1><p class="mute">ล็อกอินด้วย Google เพื่อดูและจัดการทริป</p><div id="gbtn"></div></div>';
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'th' });
}
function logout() { token = ''; sessionStorage.removeItem('tk'); S.cur = null; closeM(); renderLogin(); }

// ===== รายการทริป =====
async function loadTrips() {
  $('#app').innerHTML = '<p class="empty">กำลังโหลด…</p>';
  try { const d = await api('listTrips'); S.me = d.me; S.trips = d.trips; S.cur = null; renderList(); }
  catch (e) { if (token) { toast(e.message); $('#app').innerHTML = '<p class="empty">โหลดไม่สำเร็จ<br><br><button class="pri" onclick="loadTrips()">ลองใหม่</button></p>'; } }
}
function renderList() {
  const a = S.me.admin;
  $('#app').innerHTML =
    '<div class="top"><div><h1>ทริปของฉัน</h1><div class="mute">' + esc(S.me.email) + '</div></div><button class="ghost" onclick="logout()">ออกจากระบบ</button></div>' +
    (S.trips.length ? S.trips.map(t => '<button class="trip" onclick="openTrip(\'' + esc(t.trip_id) + '\')"><b>' + esc(t.name) + '</b><div class="mute">' + esc(t.country) + ' · ' + esc(t.days) + ' วัน' + (t.start_date ? ' · เริ่ม ' + fmtDate(t.start_date, 0) : '') + '</div></button>').join('')
      : '<p class="empty">' + (a ? 'ยังไม่มีทริป กดปุ่มด้านล่างเพื่อสร้างทริปแรก' : 'ยังไม่มีทริปที่คุณเข้าได้ ให้เจ้าของระบบเพิ่มอีเมลของคุณก่อน') + '</p>') +
    (a ? '<button id="fab" class="pri" onclick="tripForm()">+ สร้างทริป</button>' : '');
}
function fmtDate(s, add) {
  const d = new Date(String(s).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return '';
  d.setDate(d.getDate() + add);
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
}

// ===== หน้าทริป =====
async function openTrip(id) {
  $('#app').innerHTML = '<p class="empty">กำลังโหลด…</p>';
  try { S.cur = await api('getTrip', { tripId: id }); S.day = 0; renderTrip(); }
  catch (e) { toast(e.message); renderList(); }
}
const canEdit = () => S.cur && S.cur.role !== 'viewer';
function renderTrip() {
  const t = S.cur.trip, n = Number(t.days) || 1;
  let tabs = '<button class="tab" role="tab" aria-selected="' + (S.day === 0) + '" onclick="setDay(0)">ยังไม่จัดวัน<small>' + S.cur.places.filter(p => !Number(p.day)).length + ' ที่</small></button>';
  for (let i = 1; i <= n; i++) tabs += '<button class="tab" role="tab" aria-selected="' + (S.day === i) + '" onclick="setDay(' + i + ')">วัน ' + i + '<small>' + (t.start_date ? fmtDate(t.start_date, i - 1) : S.cur.places.filter(p => Number(p.day) === i).length + ' ที่') + '</small></button>';
  const list = S.cur.places.filter(p => Number(p.day) === S.day).sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')) || String(a.name).localeCompare(String(b.name)));
  $('#app').innerHTML =
    '<div class="top"><button class="ghost" onclick="loadTrips()">‹ ทริปทั้งหมด</button>' + (canEdit() ? '<button class="ghost" onclick="tripForm(true)">ตั้งค่าทริป</button>' : '') + '</div>' +
    '<h1>' + esc(t.name) + '</h1><div class="mute">' + esc(t.country) + ' · ' + n + ' วัน' + (t.currency ? ' · ' + esc(t.currency) : '') + (canEdit() ? '' : ' · ดูได้อย่างเดียว') + '</div>' +
    nowBanner() + '<div class="tabs" role="tablist" style="margin-top:12px">' + tabs + '</div>' + (S.day && list.length ? mapBlock(list) : '') +
    (list.length ? list.map(placeCard).join('') : '<p class="empty">' + (S.day ? 'วันนี้ยังไม่มีแผน' : 'ไม่มีสถานที่ที่รอจัดวัน') + (canEdit() ? '<br>กดปุ่ม “+ เพิ่มสถานที่” ด้านล่าง' : '') + '</p>') +
    (canEdit() ? '<button id="fab" class="pri" onclick="placeForm()">+ เพิ่มสถานที่</button>' : '');
}
function mapBlock(list) {
  const q = list.map(p => encodeURIComponent([p.name, p.city].filter(Boolean).join(' ')));
  const src = q.length === 1 ? 'https://www.google.com/maps?q=' + q[0] + '&output=embed'
    : 'https://www.google.com/maps?output=embed&saddr=' + q[0] + '&daddr=' + q.slice(1).join('+to:');
  const open = q.length === 1 ? 'https://www.google.com/maps/search/?api=1&query=' + q[0]
    : 'https://www.google.com/maps/dir/?api=1&origin=' + q[0] + '&destination=' + q[q.length - 1] + (q.length > 2 ? '&waypoints=' + q.slice(1, -1).join('%7C') : '');
  return '<div class="map"><iframe title="แผนที่วัน ' + S.day + '" src="' + src + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>' +
    '<div class="mapbar"><span class="mute">' + list.length + ' จุด เรียงตามเวลา</span><a href="' + open + '" target="_blank" rel="noopener">เปิดเส้นทางใน Google Maps</a></div>';
}
function fmtDT(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function ciBtns(p) {
  if (!canEdit()) return '';
  const id = esc(p.place_id);
  return p.checkin_at
    ? '<button class="ci-btn again" onclick="checkIn(\'' + id + '\')">อัปเดตเวลาเช็คอิน</button><button class="ghost" onclick="checkIn(\'' + id + '\',true)">ยกเลิกเช็คอิน</button>'
    : '<button class="ci-btn" onclick="checkIn(\'' + id + '\')">เช็คอิน</button>';
}
function ciLine(p) {
  const t = p.checkin_at ? fmtDT(p.checkin_at) : '';
  if (!t) return '';
  const by = p.checkin_by && S.me && String(p.checkin_by).toLowerCase() !== S.me.email ? ' · โดย ' + esc(String(p.checkin_by).split('@')[0]) : '';
  return '<div class="ci">✓ เช็คอินแล้ว ' + t + by + '</div>';
}
async function checkIn(id, clear) {
  try {
    const p = await api('checkIn', { tripId: S.cur.trip.trip_id, placeId: id, clear: !!clear });
    const i = S.cur.places.findIndex(x => x.place_id === p.place_id);
    if (i >= 0) S.cur.places[i] = p;
    renderTrip(); toast(clear ? 'ยกเลิกเช็คอินแล้ว' : 'เช็คอินแล้ว ' + fmtDT(p.checkin_at));
  } catch (e) { toast(e.message); }
}
function curPlace() {
  let b = null;
  (S.cur ? S.cur.places : []).forEach(p => { const t = Date.parse(p.checkin_at); if (!isNaN(t) && (!b || t > b.t)) b = { p: p, t: t }; });
  return b && b.p;
}
function nowBanner() {
  const c = curPlace();
  if (!c) return '';
  return '<div class="now"><div><div class="mute">คุณอยู่ที่ · เช็คอิน ' + fmtDT(c.checkin_at) + '</div><b>' + esc(c.name) + '</b></div><button class="pri sm" onclick="pickNext()">ไปที่ไหนต่อ?</button></div>';
}
function goBtn(p) {
  const c = curPlace();
  return !c || c.place_id === p.place_id ? '' : '<button class="go" onclick="goNext(\'' + esc(p.place_id) + '\')">ไปที่นี่ต่อ</button>';
}
function pickNext() {
  const c = curPlace(); if (!c) return;
  const dk = p => Number(p.day) || 99;
  const others = S.cur.places.filter(p => p.place_id !== c.place_id).sort((a, b) =>
    (Number(a.day) === Number(c.day) ? 0 : 1) - (Number(b.day) === Number(c.day) ? 0 : 1) || dk(a) - dk(b) || String(a.time || '99:99').localeCompare(String(b.time || '99:99')));
  const rows = others.map(p => '<button class="opt" onclick="goNext(\'' + esc(p.place_id) + '\')"><b>' + esc(p.name) + '</b><small>' + (Number(p.day) ? 'วัน ' + Number(p.day) : 'ยังไม่จัดวัน') + (p.time ? ' · ' + esc(p.time) : '') + (p.city ? ' · ' + esc(p.city) : '') + '</small></button>').join('');
  openM('<h2>ไปที่ไหนต่อ?</h2><div class="mute">จาก ' + esc(c.name) + '</div>' + (rows || '<p class="empty">ยังไม่มีสถานที่อื่นในทริปนี้</p>') + '<div class="btns"><button class="ghost" onclick="closeM()">ปิด</button></div>');
}
const VEH = { SUBWAY:'รถไฟใต้ดิน', BUS:'รถเมล์', HEAVY_RAIL:'รถไฟ', COMMUTER_TRAIN:'รถไฟชานเมือง', HIGH_SPEED_TRAIN:'รถไฟความเร็วสูง', LONG_DISTANCE_TRAIN:'รถไฟทางไกล', RAIL:'รถไฟ', METRO_RAIL:'รถไฟฟ้า', MONORAIL:'โมโนเรล', TRAM:'รถราง', LIGHT_RAIL:'รถไฟฟ้ารางเบา', FERRY:'เรือ', CABLE_CAR:'กระเช้า', FUNICULAR:'ฟูนิคูลาร์', TROLLEYBUS:'รถบัสไฟฟ้า', SHARE_TAXI:'รถแท็กซี่ร่วม' };
const MODE_TH = { transit:'รถไฟ / รถเมล์', walking:'เดิน', driving:'รถยนต์ / แท็กซี่', bicycling:'จักรยาน' };
const SYM = { JPY:'¥', THB:'฿', KRW:'₩', EUR:'€', USD:'$', GBP:'£' };
const fmtMin = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' นาที' : Math.floor(m / 60) + ' ชม. ' + (m % 60 ? (m % 60) + ' นาที' : ''); };
const fmtDist = m => m < 1000 ? m + ' ม.' : (m / 1000).toFixed(1) + ' กม.';
const money = (c, a) => (SYM[c] || c + ' ') + Number(a).toLocaleString('th-TH', { maximumFractionDigits: 2 });
function modeLinks(base) {
  return Object.keys(MODE_TH).map(k => '<a class="opt" href="' + base + k + '" target="_blank" rel="noopener"><b>' + MODE_TH[k] + '</b><small>เปิดเส้นทางใน Google Maps</small></a>').join('');
}
const DEMO = false;
const MC = { transit:'#0F7B84', walking:'#D97706', driving:'#2563EB', bicycling:'#7C3AED' };
let RT = null, LMAP = null, LGRP = null;
function dec(s) {
  const o = []; let i = 0, la = 0, ln = 0;
  while (i < s.length) {
    for (let k = 0; k < 2; k++) {
      let sh = 0, r = 0, b;
      do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const v = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k) ln += v; else la += v;
    }
    o.push([la / 1e5, ln / 1e5]);
  }
  return o;
}
function modeBody(m) {
  const b = RT.base;
  const link = '<a href="' + b + m.mode + '" target="_blank" rel="noopener">เปิดใน Google Maps</a>';
  if (!m.ok) return '<div class="mute">ไม่มีข้อมูลเส้นทางนี้</div>' + link;
  let h = '';
  if (m.mode === 'transit') {
    const tr = m.steps.filter(s => s.t === 'transit').length;
    h += m.fare ? '<div class="fare">ค่าโดยสาร ' + money(m.fare.cur, m.fare.amt) + (m.fare.cur !== 'THB' && m.fare.thb ? ' ≈ ฿' + m.fare.thb.toLocaleString('th-TH', { maximumFractionDigits: 2 }) : '') + '</div>'
      : '<div class="mute">ไม่มีข้อมูลค่าโดยสารสำหรับเส้นทางนี้</div>';
    h += '<div class="mute">' + (tr > 1 ? 'ต่อรถ ' + (tr - 1) + ' ครั้ง' : tr === 1 ? 'ไม่ต้องต่อรถ' : '') + '</div>';
    h += '<ol class="stp">' + m.steps.map(s => s.t === 'walk'
      ? (s.sec >= 60 ? '<li>เดิน ' + fmtMin(s.sec) + ' (' + fmtDist(s.m) + ')</li>' : '')
      : '<li>นั่ง' + esc(VEH[s.vehicle] || 'ขนส่งสาธารณะ') + ' ' + esc(s.line) + (s.head ? ' ไป ' + esc(s.head) : '') + ' จาก ' + esc(s.from) + ' ไป ' + esc(s.to) + (s.stops ? ' (' + s.stops + ' ป้าย/สถานี)' : '') + '</li>').join('') + '</ol>';
  } else if (m.mode === 'driving') h += '<div class="mute">ไม่มีข้อมูลราคาแท็กซี่</div>';
  return h + link;
}
function cardsHtml() {
  return RT.modes.map(m => {
    const on = m.mode === RT.sel;
    const sum = m.ok ? fmtMin(m.sec) + ' · ' + fmtDist(m.meters) : 'ไม่มีข้อมูล';
    return '<div class="mode' + (on ? ' on' : '') + '"><button class="mhead" onclick="pickMode(\'' + m.mode + '\')" aria-expanded="' + on + '"><i class="dot" style="background:' + MC[m.mode] + '"></i><b>' + MODE_TH[m.mode] + '</b><span class="mute">' + sum + '</span></button>' +
      (on ? '<div class="mbody">' + modeBody(m) + '</div>' : '') + '</div>';
  }).join('');
}
function pickMode(k) { RT.sel = k; $('#rcards').innerHTML = cardsHtml(); drawLines(false); }
function schematic() {
  const P = { transit: 'M40 180 C120 180 140 60 220 60 S340 110 360 40', walking: 'M40 180 Q200 215 360 40', driving: 'M40 180 Q90 100 200 125 T360 40', bicycling: 'M40 180 Q230 150 360 40' };
  const paths = Object.keys(P).sort((a, b) => (a === RT.sel) - (b === RT.sel)).map(k => '<path d="' + P[k] + '" fill="none" stroke="' + MC[k] + '" stroke-width="' + (k === RT.sel ? 6 : 3) + '" opacity="' + (k === RT.sel ? 1 : .3) + '" stroke-linecap="round"' + (k === 'walking' ? ' stroke-dasharray="2 9"' : '') + '/>').join('');
  return '<svg viewBox="0 0 400 230" role="img" aria-label="ภาพจำลองเส้นทาง"><g stroke="#fff" stroke-width="10" opacity=".9" fill="none"><path d="M-10 120 L410 140"/><path d="M110 -10 L150 240"/><path d="M290 -10 L250 240"/></g>' + paths +
    '<circle cx="40" cy="180" r="8" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="360" cy="40" r="8" fill="#111"/><text x="392" y="222" text-anchor="end" font-size="10" fill="#8A8F98">ภาพจำลอง ไม่ใช่เส้นทางจริง</text></svg>';
}
function drawLines(fit) {
  if (typeof L === 'undefined') { const el = $('#rmap'); if (el) el.innerHTML = DEMO ? schematic() : '<div class="empty">โหลดแผนที่ไม่ได้</div>'; return; }
  LGRP.clearLayers();
  const all = []; let A = null, B = null;
  [...RT.modes].sort((a, b) => (a.mode === RT.sel) - (b.mode === RT.sel)).forEach(m => {
    if (!m.ok || !m.line) return;
    const on = m.mode === RT.sel, pts = dec(m.line);
    if (!A && pts.length) { A = pts[0]; B = pts[pts.length - 1]; }
    pts.forEach(p => all.push(p));
    const st = { color: MC[m.mode], weight: on ? 6 : 3, opacity: on ? .95 : .3 };
    if (m.mode === 'transit' && m.segs && m.segs.length) m.segs.forEach(sg => L.polyline(dec(sg.p), sg.t === 'walk' ? Object.assign({}, st, { color: '#555', dashArray: '2 8' }) : st).addTo(LGRP));
    else L.polyline(pts, st).addTo(LGRP);
  });
  if (A) {
    L.circleMarker(A, { radius: 7, color: '#111', weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(LGRP);
    L.circleMarker(B, { radius: 7, color: '#111', weight: 3, fillColor: '#111', fillOpacity: 1 }).addTo(LGRP);
  }
  if (fit && all.length) LMAP.fitBounds(all, { padding: [24, 24] });
}
function initMap() {
  const el = $('#rmap'); if (!el) return;
  if (typeof L === 'undefined') { drawLines(true); return; }
  LMAP = L.map(el);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(LMAP);
  LGRP = L.layerGroup().addTo(LMAP);
  drawLines(true);
}
async function goNext(id) {
  const c = curPlace(), d = S.cur.places.find(p => p.place_id === id);
  if (!c || !d) return;
  const q = p => encodeURIComponent([p.name, p.city].filter(Boolean).join(' '));
  const base = 'https://www.google.com/maps/dir/?api=1&origin=' + q(c) + '&destination=' + q(d) + '&travelmode=';
  const head = '<h2>' + esc(c.name) + ' → ' + esc(d.name) + '</h2>';
  const foot = '<div class="btns"><button class="ghost" onclick="pickNext()">เลือกปลายทางอื่น</button><button class="ghost" onclick="closeM()">ปิด</button></div>';
  closeM(); openM(head + '<p class="empty">กำลังค้นหาเส้นทาง…</p>');
  const txt = p => [p.name, p.city, S.cur.trip.country].filter(Boolean).join(' ');
  try {
    const r = await api('route', { tripId: S.cur.trip.trip_id, origin: txt(c), dest: txt(d) });
    const first = r.modes.find(m => m.mode === 'transit' && m.ok) || r.modes.find(m => m.ok) || r.modes[0];
    RT = { modes: r.modes, base: base, sel: first.mode };
    openM(head + '<div class="mute">แตะวิธีเดินทางเพื่อดูเส้นทางบนแผนที่' + (r.demo ? ' · ข้อมูลตัวอย่างในหน้าทดลอง' : '') + '</div><div id="rmap" class="rmap"></div><div id="rcards">' + cardsHtml() + '</div>' +
      '<p class="mute" style="margin:14px 0 0">ค่าโดยสารมาจาก Google ตามเส้นทางที่มีข้อมูล ส่วนเงินบาทเป็นการแปลงตามอัตราแลกเปลี่ยนโดยประมาณ</p>' + foot);
    setTimeout(initMap, 0);
  } catch (e) {
    openM(head + '<div class="mute">ดึงรายละเอียดในแอปไม่ได้ (' + esc(e.message) + ') เลือกเปิดใน Google Maps แทน</div>' + modeLinks(base) + foot);
  }
}
function placeCard(p) {
  return '<div class="pl"><div class="tm">' + esc(p.time || '–') + '</div><div><h2>' + esc(p.name) + '</h2><div class="tag">' + esc(TYPES[p.type] || '') + (p.city ? ' · ' + esc(p.city) : '') + '</div>' +
    (p.note ? '<p class="note">' + esc(p.note) + '</p>' : '') + ciLine(p) +
    '<div class="act">' + ciBtns(p) + goBtn(p) + (p.map_url ? '<a href="' + esc(p.map_url) + '" target="_blank" rel="noopener">เปิดแผนที่</a>' : '') +
    (canEdit() ? '<button class="ghost" onclick="placeForm(\'' + esc(p.place_id) + '\')">แก้ไข</button><button class="ghost danger" onclick="delPlace(\'' + esc(p.place_id) + '\')">ลบ</button>' : '') + '</div></div></div>';
}
function setDay(d) { S.day = d; renderTrip(); }

// ===== ฟอร์ม =====
function openM(h) { $('#modal').innerHTML = '<div class="sheet">' + h + '</div>'; $('#modal').classList.add('on'); const f = $('#modal input'); if (f) f.focus(); }
function closeM() { if (typeof LMAP !== 'undefined' && LMAP) { LMAP.remove(); LMAP = null; } $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

function tripForm(edit) {
  const t = edit ? S.cur.trip : { name: '', country: '', days: 3, start_date: '', currency: '' };
  openM('<h2>' + (edit ? 'ตั้งค่าทริป' : 'สร้างทริปใหม่') + '</h2>' +
    '<label for="f1">ชื่อทริป</label><input id="f1" value="' + esc(t.name) + '" placeholder="เช่น เชียงใหม่ 3 วัน">' +
    '<div class="row"><div><label for="f2">ประเทศ</label><input id="f2" value="' + esc(t.country) + '"></div><div><label for="f3">จำนวนวัน</label><input id="f3" type="number" min="1" value="' + esc(t.days) + '"></div></div>' +
    '<div class="row"><div><label for="f4">วันที่เริ่ม</label><input id="f4" type="date" value="' + esc(String(t.start_date).slice(0, 10)) + '"></div><div><label for="f5">สกุลเงิน</label><input id="f5" value="' + esc(t.currency) + '" placeholder="THB"></div></div>' +
    (edit ? '<p class="mute">ถ้าลดจำนวนวัน สถานที่ในวันที่ถูกตัดจะย้ายไป “ยังไม่จัดวัน” ไม่ถูกลบ</p>' : '') +
    '<div class="btns"><button class="ghost" onclick="closeM()">ยกเลิก</button><button class="pri" onclick="saveTrip(' + !!edit + ')">บันทึก</button></div>');
}
async function saveTrip(edit) {
  const f = { name: $('#f1').value, country: $('#f2').value, days: $('#f3').value, start_date: $('#f4').value, currency: $('#f5').value };
  try {
    if (edit) { S.cur = await api('updateTrip', { tripId: S.cur.trip.trip_id, fields: f }); if (S.day > Number(S.cur.trip.days)) S.day = 0; closeM(); renderTrip(); }
    else { await api('createTrip', f); closeM(); loadTrips(); }
    toast('บันทึกแล้ว');
  } catch (e) { toast(e.message); }
}

function placeForm(id) {
  const p = id ? S.cur.places.find(x => x.place_id === id) : { name: '', type: 'sight', city: '', map_url: '', note: '', time: '', day: S.day };
  const n = Number(S.cur.trip.days) || 1;
  let days = '<option value="0">ยังไม่จัดวัน</option>';
  for (let i = 1; i <= n; i++) days += '<option value="' + i + '"' + (Number(p.day) === i ? ' selected' : '') + '>วัน ' + i + '</option>';
  openM('<h2>' + (id ? 'แก้ไขสถานที่' : 'เพิ่มสถานที่') + '</h2>' +
    '<label for="p1">ชื่อสถานที่</label><input id="p1" value="' + esc(p.name) + '">' +
    '<div class="row"><div><label for="p2">ประเภท</label><select id="p2">' + Object.keys(TYPES).map(k => '<option value="' + k + '"' + (p.type === k ? ' selected' : '') + '>' + TYPES[k] + '</option>').join('') + '</select></div>' +
    '<div><label for="p3">เมือง</label><input id="p3" value="' + esc(p.city) + '"></div></div>' +
    '<div class="row"><div><label for="p4">วัน</label><select id="p4">' + days + '</select></div><div><label for="p5">เวลา</label><input id="p5" type="time" value="' + esc(p.time) + '"></div></div>' +
    '<label for="p6">ลิงก์แผนที่</label><input id="p6" type="url" value="' + esc(p.map_url) + '" placeholder="https://maps.app.goo.gl/…">' +
    '<label for="p7">โน้ต</label><textarea id="p7" rows="3">' + esc(p.note) + '</textarea>' +
    '<div class="btns"><button class="ghost" onclick="closeM()">ยกเลิก</button><button class="pri" onclick="savePlace(\'' + (id || '') + '\')">บันทึก</button></div>');
}
async function savePlace(id) {
  const place = { name: $('#p1').value, type: $('#p2').value, city: $('#p3').value, day: $('#p4').value, time: $('#p5').value, map_url: $('#p6').value, note: $('#p7').value };
  if (id) place.place_id = id;
  try {
    const p = await api('savePlace', { tripId: S.cur.trip.trip_id, place });
    const i = S.cur.places.findIndex(x => x.place_id === p.place_id);
    if (i >= 0) S.cur.places[i] = p; else S.cur.places.push(p);
    S.day = Number(p.day) || 0; closeM(); renderTrip(); toast('บันทึกแล้ว');
  } catch (e) { toast(e.message); }
}
async function delPlace(id) {
  const p = S.cur.places.find(x => x.place_id === id);
  if (!confirm('ลบ “' + p.name + '” ?')) return;
  try { await api('deletePlace', { tripId: S.cur.trip.trip_id, placeId: id }); S.cur.places = S.cur.places.filter(x => x.place_id !== id); renderTrip(); toast('ลบแล้ว'); }
  catch (e) { toast(e.message); }
}
</script>
</body>
